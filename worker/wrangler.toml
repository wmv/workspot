name = "workspot"
account_id = "146ab5a2a9e84617b2985cadb0e47be9"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
preview_urls = true

# Serve the built PWA from the same Worker. /api/* always hits the Hono app;
# everything else is a static asset with SPA fallback for client routing.
[assets]
directory = "../dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Replace `id` with a real Hyperdrive config once Neon exists.
# Local `wrangler dev` uses localConnectionString.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "00000000-0000-0000-0000-000000000000"
localConnectionString = "postgres://workspot:workspot@127.0.0.1:5434/workspot"
