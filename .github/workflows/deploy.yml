name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Skip gracefully on forks / before the maintainer secret is configured.
      - name: Check for deploy credentials
        id: token
        run: echo "present=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.token.outputs.present != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping deploy."

      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.token.outputs.present == 'true'
        run: npm ci
      - if: steps.token.outputs.present == 'true'
        run: npm run build

      # Venue data ships in src/data/venues.json, but production reads Neon.
      # Migrate and seed before deploying so merged venues actually go live.
      # DATABASE_URL must be the direct (unpooled) Neon connection string.
      - name: Check for database credentials
        id: db
        if: steps.token.outputs.present == 'true'
        run: echo "present=${{ secrets.DATABASE_URL != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.token.outputs.present == 'true' && steps.db.outputs.present != 'true'
        run: echo "::warning::DATABASE_URL is not set; venues.json changes will not reach production."
      - name: Migrate and seed database
        if: steps.db.outputs.present == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npx tsx tools/migrate.ts
          npx tsx tools/seed.ts

      - name: Deploy Worker
        if: steps.token.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy -c worker/wrangler.toml
