name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Skip gracefully on forks / before the maintainer secret is configured.
      - name: Check for deploy credentials
        id: token
        run: echo "present=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.token.outputs.present != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping deploy."

      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 20
          cache: npm
      - if: steps.token.outputs.present == 'true'
        run: npm ci
      - if: steps.token.outputs.present == 'true'
        run: npm run build
      - name: Deploy Worker
        if: steps.token.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy -c worker/wrangler.toml
