services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: workspot
      POSTGRES_PASSWORD: workspot
      POSTGRES_DB: workspot
    ports:
      - "5434:5432"
    volumes:
      - workspot_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workspot -d workspot"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  workspot_pg:
